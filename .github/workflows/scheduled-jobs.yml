# Manual-only: vercel.json's own cadence (weekly at the fastest, biweekly for most jobs) now sits
# well under Vercel Hobby's once-a-day-per-cron limit, so this workflow no longer needs a schedule
# to fill the gap. Kept for an on-demand run (workflow_dispatch). Calls the same authenticated
# /api/cron/<job> endpoints; inactive until the repository secrets SITE_URL
# (e.g. https://made4buyers.com) and CRON_SECRET are set.
name: Scheduled jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run (scrape-sources, collect-scrapes, ingest, retry-failed, publish-cycle, cleanup-cache, detect-stale, enrich-images, reclassify-content, daily-article, inspect-index)"
        required: true
        default: retry-failed

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoints
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MANUAL_JOB: ${{ github.event.inputs.job }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets not set — skipping."; exit 0
          fi
          JOBS="$MANUAL_JOB"
          status=0
          for job in $JOBS; do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/$job")
            echo "$job -> HTTP $code: $(head -c 400 /tmp/out.json)"
            # 409 = already running (lock held) — not a failure.
            if [ "$code" != "200" ] && [ "$code" != "409" ]; then status=1; fi
          done
          exit $status
